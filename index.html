<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amset</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">A</span>
    <span>
      <strong data-i18n="app.name">Amset</strong>
      <small data-i18n="app.tagline">Gestion des salariés</small>
    </span>
  </div>
  <nav class="tabs" aria-label="Sections">
    <a href="#" class="tab is-active" data-i18n="nav.staff">Salariés</a>
    <a href="#" class="tab is-disabled" data-i18n="nav.payroll">Paie</a>
    <a href="#" class="tab is-disabled" data-i18n="nav.feedback">Retours clients</a>
  </nav>
  <div class="lang" role="group" aria-label="Langue">
    <button type="button" data-lang="fr">FR</button>
    <button type="button" data-lang="en">EN</button>
  </div>
</header>

<main class="layout">

  <section class="col-list">

    <form class="filters" id="filters" autocomplete="off">
      <div class="filters-row">
        <label class="field">
          <span data-i18n="filter.site">Site</span>
          <select id="filter-site">
            <option value="" data-i18n="filter.allSites">Tous les sites</option>
          </select>
        </label>
        <label class="field field-grow">
          <span data-i18n="filter.name">Nom ou prénom</span>
          <input type="search" id="filter-q" placeholder="Bernard">
        </label>
      </div>
      <fieldset class="chips">
        <legend data-i18n="filter.skills">Compétences</legend>
        <div id="filter-skills"></div>
      </fieldset>
    </form>

    <div class="list-head">
      <p id="result-count" aria-live="polite"></p>
      <button type="button" class="btn btn-primary" id="btn-new" data-i18n="action.new">Nouvelle fiche</button>
    </div>

    <table class="grid">
      <thead>
        <tr id="grid-head">
          <th scope="col"><button type="button" data-sort="nom" data-i18n="col.lastName">Nom</button></th>
          <th scope="col"><button type="button" data-sort="prenom" data-i18n="col.firstName">Prénom</button></th>
          <th scope="col"><button type="button" data-sort="site" data-i18n="col.site">Site</button></th>
          <th scope="col"><button type="button" data-sort="skillCount" data-i18n="col.skills">Compétences</button></th>
        </tr>
      </thead>
      <tbody id="grid-body"></tbody>
    </table>
  </section>

  <aside class="col-detail" id="panel" aria-live="polite"></aside>

</main>

<script src="js/i18n/fr.js"></script>
<script src="js/i18n/en.js"></script>
<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
</body>
</html>
